name: Build Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Předinstalační ověření oddělení DB migrací od deploye
        run: node scripts/check-no-auto-prod-db-push.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit testy
        run: npm run test:unit

      - name: RLS guard (dev mode)
        run: npm run check:rls

      - name: Build
        run: npm run build

      - name: Set up JDK 17 for temporary Android APK
        if: github.head_ref == 'tmp/settleup-import-20260823'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle for temporary Android APK
        if: github.head_ref == 'tmp/settleup-import-20260823'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 35
        if: github.head_ref == 'tmp/settleup-import-20260823'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build and verify Settle Up Import APK
        if: github.head_ref == 'tmp/settleup-import-20260823'
        working-directory: tmp-settleup-import
        run: |
          gradle --no-daemon assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload verified Settle Up APK
        if: github.head_ref == 'tmp/settleup-import-20260823'
        uses: actions/upload-artifact@v4
        with:
          name: SettleUp-Import-Android16-VERIFIED
          path: tmp-settleup-import/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
